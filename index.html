<style>

*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:4px 0 10px;text-align:center}

<body>
<main id="drop">
<h1>交錯命途 · 起點機率計算</h1>

<div class="topbar">橫線數量:<span id="known">0</span> / <input id="n" type="number" min="1" max="25" value="5" aria-label="橫線總數"></div>
<svg class="board" id="board" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg"></svg>

<div class="card">
  <h2>已走過的路徑(每走一次就記一筆)</h2>

</div>

<div class="card">
  <details><summary>完整機率表(起點 → 獎賞)</summary><div id="table"></div></details>
</div>

<script>
/*CORE*/
const R=5,C=6,G=5;
const fmt=p=>p>0&&p<0.1?'&lt;0.1%':p.toFixed(1)+'%';
function derive(paths){
  const present=new Set(),absent=new Set();
  for(const pa of paths){
    let p=pa.s;
    for(let r=0;r<R;r++){
      const m=pa.m[r];
      if(m==='S'){ if(p>0)absent.add(r+','+(p-1)); if(p<G)absent.add(r+','+p); }
      else if(m==='L'){ present.add(r+','+(p-1)); p--; }
      else { present.add(r+','+p); p++; }
    }
  }
  let bad=false;
  for(const k of present) if(absent.has(k)) bad=true;
  return {present,absent,bad};
}
function compute(n,present,absent){
  const cnt=Array.from({length:C},()=>Array(C).fill(0));
  let tot=0;
  const grid=Array.from({length:R},()=>Array(G).fill(false));
  const cover=Array(C).fill(0);
  const get=(r,g)=>r>=0&&r<R&&g>=0&&g<G&&grid[r][g];
  function can(r,g){
    if(get(r,g-1)||get(r,g+1))return false;
    return true;
  }
  const put=(r,g,v)=>{grid[r][g]=v;const d=v?1:-1;cover[g]+=d;cover[g+1]+=d;};
  const forced=[...present].map(k=>k.split(',').map(Number));
  for(const [r,g] of forced){ if(!can(r,g)) return {tot:0,cnt}; put(r,g,true); }
  const slots=[];
  for(let r=0;r<R;r++)for(let g=0;g<G;g++) if(!grid[r][g]&&!absent.has(r+','+g)) slots.push([r,g]);
  const need=n-forced.length;
  if(need<0) return {tot:0,cnt};
  function leaf(){
    for(let i=0;i<C;i++) if(!cover[i]) return;
    tot++;
    for(let st=0;st<C;st++){
      let p=st;
      for(let r=0;r<R;r++){
        if(p<G&&grid[r][p]) p++;
        else if(p>0&&grid[r][p-1]) p--;
      }
      cnt[st][p]++;
    }
  }
  function dfs(i,left){
    if(left===0){leaf();return;}
    if(slots.length-i<left) return;
    const [r,g]=slots[i];
    if(can(r,g)){ put(r,g,true); dfs(i+1,left-1); put(r,g,false); }
    dfs(i+1,left);
  }
  dfs(0,need);
  return {tot,cnt};
}
/*END*/
/*VISION*/
// 不依賴固定解析度:先由圖上的藍色圓點推算格點位置(以格距為單位),再偵測所有青白色發光路徑(可同時有多條)
function groupVals(vals,tol){
  vals=[...vals].sort((a,b)=>a-b);const gs=[];
  for(const v of vals){const g=gs[gs.length-1];
    if(g&&v-g.c<=tol){g.v.push(v);g.c=g.v.reduce((a,b)=>a+b)/g.v.length;}else gs.push({v:[v],c:v});}
  return gs;
}
// 先用嚴格的藍色判斷;縮小或壓縮過的圖圓點會變淡變小,找不到盤面時再放寬重試
function calibrate(data,W,H){return calibrateWith(data,W,H,false)||calibrateWith(data,W,H,true);}
function calibrateWith(data,W,H,loose){
  const lo=Math.max(loose?3:4,(W*0.004)**2),hi=(W*0.035)**2;
  const isBlue=loose
    ?i=>{const r=data[i],g=data[i+1],b=data[i+2];return b>=160&&b-g>=15&&g>=100&&g<=220&&r<=140;}
    :i=>{const r=data[i],g=data[i+1],b=data[i+2];return b>=170&&b-g>=25&&g>=110&&g<=215&&r<=135;};
  const seen=new Uint8Array(W*H),dots=[],nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=y*W+x;if(seen[k]||!isBlue(k*4))continue;
    const st=[k];seen[k]=1;let n=0,sx=0,sy=0,x0=W,x1=0,y0=H,y1=0;
    while(st.length){
      const q=st.pop(),qx=q%W,qy=(q-qx)/W;n++;sx+=qx;sy+=qy;if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
      for(const [a,b] of nb){const nx=qx+a,ny=qy+b;if(nx<0||ny<0||nx>=W||ny>=H)continue;
        const nk=ny*W+nx;if(!seen[nk]&&isBlue(nk*4)){seen[nk]=1;st.push(nk);}}
    }
    const bw=x1-x0+1,bh=y1-y0+1,fill=n/(bw*bh);
    if(n>=lo&&n<=hi&&bw/bh>0.7&&bw/bh<1.45&&fill>0.35)dots.push({x:sx/n,y:sy/n,n});
  }
  // 圓點會隨動畫脈動變大小,只排除明顯離群的(背景與圖示裡的藍色雜訊)
  let mode=0,cnt=0;
  for(const d of dots){const k=dots.filter(e=>e.n>d.n*0.6&&e.n<d.n*1.67).length;if(k>cnt){cnt=k;mode=d.n;}}
  for(let i=dots.length-1;i>=0;i--)if(!(dots[i].n>mode*0.4&&dots[i].n<mode*2.5))dots.splice(i,1);
  const tol=W*0.012;
  // 路徑全亮時圓點幾乎都被蓋住,改用亮線本身補充:垂直亮線給欄位、水平亮線給列
  const xv=dots.map(d=>d.x),vl=scanLines(data,W,H,true,H*0.07);for(const x of vl)xv.push(x,x);
  const fx=fitAxis(xv,6,W*0.1,W*0.2,tol,W/2,2);
  if(!fx)return null;
  const yv=dots.map(d=>d.y);for(const y of scanLines(data,W,H,false,fx.d*0.6))yv.push(y,y);
  // 列距與欄距大致同量級,只用來排除雜訊造成的離譜間距
  // 被蓋住的列在上還是下:有亮路徑時,路徑起點就在第一列上方一格;否則假設盤面在畫面中段
  const prior=vl.top<Infinity?d=>vl.top+3*d:H*0.5;
  const fy=fitAxis(yv,5,fx.d*0.6,fx.d*1.8,tol,prior,3);
  if(!fx||!fy)return null;
  return {xs:[...Array(6)].map((_,i)=>fx.x0+i*fx.d),ys:[...Array(5)].map((_,i)=>fy.x0+i*fy.d),topY:fy.x0-fy.d,botY:fy.x0+5*fy.d,dx:fx.d};
}
// 找出夠長的青白色發光線段,回傳其中心(vertical:垂直線的 x;否則水平線的 y)
function scanLines(data,W,H,vertical,minRun){
  const n=vertical?W:H,m=vertical?H:W,ok=[];let top=Infinity;
  for(let a=0;a<n;a++){
    let cur=0,gap=0,best=0,bs=0;
    for(let b=0;b<m;b++){
      const i=(vertical?b*W+a:a*W+b)*4;
      if(data[i+1]>=225&&data[i+2]>=215){cur+=1+gap;gap=0;if(cur>best){best=cur;bs=b-cur+1;}}
      else if(cur&&++gap>2){cur=0;gap=0;}
    }
    ok.push(best>=minRun);if(best>=minRun&&bs<top)top=bs;
  }
  const out=[];
  for(let a=0;a<n;a++){
    if(!ok[a])continue;let b=a;while(b+1<n&&ok[b+1])b++;
    out.push((a+b)/2);a=b;
  }
  out.top=top;
  return out;
}
// 在一個軸上找等距格線:不要求每條格線都有點(路徑會蓋住圓點),由「最多圓點落在格線上」決定間距與起點,
// 再用盤面置中(prior)決定被蓋住的是前面還是後面幾條
function fitAxis(vals,total,dMin,dMax,tol,prior,minGroups){
  const gs=groupVals(vals,tol),cs=gs.map(g=>g.c),ds=[];
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++)for(let k=1;k<total;k++){
    const d=(cs[j]-cs[i])/k;if(d>=dMin&&d<=dMax)ds.push([d,cs[i]]);}
  let best=null;
  for(const [d0,o0] of ds){
    const all=[];
    gs.forEach((g,i)=>{const t=(cs[i]-o0)/d0,r=Math.round(t);if(Math.abs(t-r)*d0<=tol*1.3)all.push({r,c:cs[i],n:g.v.length});});
    // 離格線很遠的雜訊點也可能剛好落在格線上,所以只取「連續 total 格」內分數最高的視窗
    for(const w of new Set(all.map(e=>e.r))){
      const ex=all.filter(e=>e.r>=w&&e.r<w+total);
      const rs=new Set(ex.map(e=>e.r));if(rs.size<minGroups)continue;
      const rmin=Math.min(...rs),span=Math.max(...rs)-rmin;
      // 以最小平方法修正間距與起點
      const m=ex.length;let sr=0,sc=0,srr=0,src=0;
      for(const e of ex){sr+=e.r;sc+=e.c;srr+=e.r*e.r;src+=e.r*e.c;}
      const den=m*srr-sr*sr;if(!den)continue;
      const d=(m*src-sr*sc)/den,o=(sc-d*sr)/m;
      if(d<dMin||d>dMax)continue;
      const score=ex.reduce((a,e)=>a+e.n,0),first=o+rmin*d;
      for(let k=0;k<=total-1-span;k++){
        const x0=first-k*d,err=Math.abs(x0+(total-1)/2*d-(typeof prior==='function'?prior(d):prior));
        if(!best||score>best.score||(score===best.score&&err<best.err))best={score,err,d,x0};
      }
    }
  }
  return best;
}
function analyze(data,W,H){
  const geo=calibrate(data,W,H);
  const out=[];out.geo=geo;
  if(!geo)return out;
  const {xs,ys,topY,dx}=geo,u=dx/135;
  const lit=(x,y)=>{x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return false;
    const i=(y*W+x)*4;return data[i+1]>=225&&data[i+2]>=215;};
  const vfrac=(x,y0,y1)=>{let a=0,t=0;for(let y=y0;y<=y1;y+=2){for(let d=-3;d<=3;d+=3){t++;if(lit(x+d*u,y))a++;}}return t?a/t:0;};
  const hfrac=(x0,x1,y)=>{let a=0,t=0;for(let x=x0;x<=x1;x+=2){for(let d=-3;d<=3;d+=3){t++;if(lit(x,y+d*u))a++;}}return t?a/t:0;};
  for(let c=0;c<6;c++){
    if(vfrac(xs[c],topY+18*u,ys[0]-18*u)<0.5) continue;
    const m=[];let p=c;
    for(let r=0;r<5;r++){
      const y=ys[r];
      if(p<5&&hfrac(xs[p]+22*u,xs[p+1]-22*u,y)>=0.5){m.push('R');p++;}
      else if(p>0&&hfrac(xs[p-1]+22*u,xs[p]-22*u,y)>=0.5){m.push('L');p--;}
      else m.push('S');
    }
    out.push({s:c,m});
  }
  return out;
}
/*ENDV*/

const L="ABCDEF";
let S={n:5,target:0,paths:[]};
try{const v=JSON.parse(localStorage.getItem('amida'));if(v&&v.paths)S=v;}catch(e){}
if(!Array.isArray(S.manual))S.manual=[];
if(!Array.isArray(S.walked))S.walked=[];
const save=()=>{try{localStorage.setItem('amida',JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);

function walk(pa){ // returns column before each row and the end column
  let p=pa.s;const cols=[];
  for(let r=0;r<R;r++){cols.push(p);const m=pa.m[r];if(m==='L')p--;else if(m==='R')p++;}
  return {cols,end:p};
}
function sanitize(pa){
  let p=pa.s;
  for(let r=0;r<R;r++){
    let m=pa.m[r];
    if(m==='L'&&p===0)m='S';
    if(m==='R'&&p===G)m='S';
    pa.m[r]=m;
    if(m==='L')p--;else if(m==='R')p++;
  }
}
function nextMove(p,m){
  const order=['S','L','R'];
  for(let i=1;i<=3;i++){
    const c=order[(order.indexOf(m)+i)%3];
    if(c==='L'&&p===0)continue;
    if(c==='R'&&p===G)continue;
    return c;
  }
  return 'S';
}
const ARROW={S:'↓',L:'←',R:'→'};

function renderPaths(){
  $('paths').innerHTML=S.paths.map((pa,i)=>{
    const w=walk(pa);
    return '<div class="path"><select data-i="'+i+'" class="st">'+
      [...L].map((c,k)=>'<option value="'+k+'"'+(k===pa.s?' selected':S.paths.some(o=>o!==pa&&o.s===k)?' disabled':'')+'>'+c+' 出發</option>').join('')+'</select>'+
      pa.m.map((m,r)=>'<button class="mv'+(m!=='S'?' t':'')+'" data-i="'+i+'" data-r="'+r+'">'+ARROW[m]+'</button>').join('')+
      '<span class="res">→ '+L[w.end]+'</span><button class="x" data-del="'+i+'">×</button></div>';

const X=i=>50+i*100,YR=r=>260+r*100,Y0=172,Y1=730;
const MEDAL=['var(--gold)','var(--silver)','var(--bronze)'];
function board(ctx){
  const {tot,cnt,t,usedStart,usedEnd,top3,badKeys,badWalked}=ctx;
  let g='';
  for(let c=0;c<C;c++) g+='<line x1="'+X(c)+'" y1="'+Y0+'" x2="'+X(c)+'" y2="'+Y1+'" stroke="#8a7a5c" stroke-width="7" stroke-linecap="round"/>';
  S.paths.forEach(pa=>{
    let p=pa.s,pts=[X(p)+','+Y0];
    for(let r=0;r<R;r++){pts.push(X(p)+','+YR(r));const m=pa.m[r];if(m==='L')p--;else if(m==='R')p++;pts.push(X(p)+','+YR(r));}
    pts.push(X(p)+','+Y1);
    g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#bff6ff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #4fd8ee)"/>';
  });
  const VY=[Y0,...[0,1,2,3,4].map(YR),Y1];
  for(const k of S.walked){const [c,j]=k.split(',').map(Number);
    g+='<line x1="'+X(c)+'" y1="'+VY[j]+'" x2="'+X(c)+'" y2="'+VY[j+1]+'" stroke="#bff6ff" stroke-width="9" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #4fd8ee)"/>';}
  for(const k of S.manual){
    const [r,c]=k.split(',').map(Number);
    g+='<line x1="'+X(c)+'" y1="'+YR(r)+'" x2="'+X(c+1)+'" y2="'+YR(r)+'" stroke="#bff6ff" stroke-width="9" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #4fd8ee)"/>';
  }
  // 有問題的位置蓋上紅線
  const RED='stroke="#d9685a" stroke-width="9" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #d9685a)"/>';
  for(const k of badWalked){const [c,j]=k.split(',').map(Number);
    g+='<line x1="'+X(c)+'" y1="'+VY[j]+'" x2="'+X(c)+'" y2="'+VY[j+1]+'" '+RED;}
  for(const k of badKeys){const [r,c]=k.split(',').map(Number);
    g+='<line x1="'+X(c)+'" y1="'+YR(r)+'" x2="'+X(c+1)+'" y2="'+YR(r)+'" '+RED;}
  for(let c=0;c<C;c++)for(let r=0;r<R;r++) g+='<circle cx="'+X(c)+'" cy="'+YR(r)+'" r="9" fill="#5aa9e6"/>';
  for(let r=0;r<R;r++)for(let c=0;c<G;c++)
    g+='<g class="seg" data-r="'+r+'" data-g="'+c+'"><line class="hint" x1="'+(X(c)+9)+'" y1="'+YR(r)+'" x2="'+(X(c+1)-9)+'" y2="'+YR(r)+'" stroke="#bff6ff" stroke-width="9" stroke-linecap="round"/><rect x="'+X(c)+'" y="'+(YR(r)-50)+'" width="'+(X(c+1)-X(c))+'" height="100"/></g>';
  for(let c=0;c<C;c++)for(let j=0;j<=R;j++)
    g+='<g class="seg v" data-c="'+c+'" data-j="'+j+'"><line class="hint" x1="'+X(c)+'" y1="'+(VY[j]+(j?9:0))+'" x2="'+X(c)+'" y2="'+(VY[j+1]-(j<R?9:0))+'" stroke="#bff6ff" stroke-width="9" stroke-linecap="round"/><rect x="'+(X(c)-14)+'" y="'+(VY[j]+(j?10:0))+'" width="28" height="'+(VY[j+1]-VY[j]-(j?10:0)-(j<R?10:0))+'"/></g>';
  for(let c=0;c<C;c++){
    g+='<circle cx="'+X(c)+'" cy="'+Y0+'" r="13" fill="#b99a63" stroke="#f2ecdc" stroke-width="3"/><circle cx="'+X(c)+'" cy="'+Y1+'" r="13" fill="#b99a63" stroke="#f2ecdc" stroke-width="3"/>';
  }
  for(let c=0;c<C;c++){
    const rank=top3.indexOf(c),used=usedStart.includes(c);
    const ring=rank>=0?MEDAL[rank]:'#b99a63';
    g+='<g opacity="'+(used?0.4:1)+'"><circle cx="'+X(c)+'" cy="50" r="38" fill="#2f7f8f" stroke="'+ring+'" stroke-width="'+(rank>=0?8:5)+'"'+(rank>=0?' style="filter:drop-shadow(0 0 8px '+ring+')"':'')+'/>'+
      '<text x="'+X(c)+'" y="64" text-anchor="middle" font-size="40" font-weight="700" font-family="Georgia,serif" fill="#f4ecd6">'+L[c]+'</text>';
    if(tot&&!usedEnd.includes(t)&&!used){
      const p=cnt[c][t]/tot*100;
      g+='<text x="'+X(c)+'" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="'+(rank>=0?MEDAL[rank]:'#ece9e1')+'">'+fmt(p)+'</text>';
      if(rank>=0) g+='<rect x="'+(X(c)-28)+'" y="126" width="56" height="22" rx="11" fill="'+MEDAL[rank]+'"/><text x="'+X(c)+'" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1405">第 '+(rank+1)+' 名</text>';
    }else if(used) g+='<text x="'+X(c)+'" y="118" text-anchor="middle" font-size="18" fill="#9a978d">已走過</text>';
    g+='</g>';
  }
  for(let c=0;c<C;c++){
    const sel=t===c,x=X(c)-46;
    g+='<g class="slot" data-t="'+c+'"><image href="'+((S.icons&&S.icons[c])||ICONS[c])+'" x="'+x+'" y="762" width="92" height="92" />'+
      '<rect class="bg" x="'+x+'" y="762" width="92" height="92" rx="6" fill="none" stroke="'+(sel?'#f7c859':'#b99a63')+'" stroke-width="'+(sel?6:3)+'"'+(sel?' style="filter:drop-shadow(0 0 8px #f7c859)"':'')+'/>'+'</g>';
  }
  $('board').innerHTML=g;
}
// 檢查手動標記的走過直線段:從頂端每個亮起的起點照著橫線往下追。
// 追到底且沒問題的就是一條已走過的路徑;遇到不合邏輯的點(中斷、分岔成兩條路、兩側同時有橫線)時,
// 該點之前的部分維持正常,只標紅直接接在該點後面的線;往上接不到任何起點的孤立線段整段標紅
function checkWalk(bridges){
  const W=new Set(S.walked),V=(c,j)=>'v'+c+','+j,H=(r,g)=>'h'+r+','+g;
  const good=new Set(),pre=new Set(),red=new Set(),msgs=[],paths=[],probs=[];
  for(let c=0;c<C;c++){
    if(!W.has(c+',0'))continue;
    let p=c,prob=null;const segs=[c+',0'],brs=[],m=[],el=[V(c,0)];
    for(let r=0;r<R;r++){
      const rt=p<G&&bridges.has(r+','+p),lf=p>0&&bridges.has(r+','+(p-1));
      if(rt&&lf){prob={p,r,t:L[c]+' 出發的路徑在第 '+(r+1)+' 列的 '+L[p]+' 兩側同時有橫線'};break;}
      const q=rt?p+1:lf?p-1:p;
      // 轉彎時下方直線也亮著,且不是另一側有路徑經同一條橫線過來 → 分岔成兩條路
      if(q!==p&&W.has(p+','+(r+1))&&!W.has(q+','+r)){prob={p,r,t:L[c]+' 出發的路徑在第 '+(r+1)+' 列的 '+L[p]+' 分岔成兩條路'};break;}
      if(q!==p&&(q>p?q<G&&bridges.has(r+','+q):q>0&&bridges.has(r+','+(q-1)))){prob={p,r,t:L[c]+' 出發的路徑在第 '+(r+1)+' 列的 '+L[q]+' 兩側同時有橫線'};break;}
      if(!W.has(q+','+(r+1))){prob={p,r,t:L[c]+' 出發的路徑在第 '+(r+1)+' 列之後的 '+L[q]+' 欄中斷'};break;}
      if(q!==p){brs.push(r+','+Math.min(p,q));el.push(H(r,Math.min(p,q)));}
      m.push(q>p?'R':q<p?'L':'S');p=q;segs.push(p+','+(r+1));el.push(V(p,r+1));
    }
    if(prob){for(const k of el)pre.add(k);probs.push(prob);msgs.push(prob.t);}
    else{for(const k of el)good.add(k);paths.push({s:c,m,segs,brs});}
  }
  // 只標紅直接接在問題點後面的線(往下的直線與左右的橫線)
  const out=(x,y)=>{const o=[];
    if(W.has(x+','+(y+1)))o.push(V(x,y+1));
    if(x>0&&bridges.has(y+','+(x-1)))o.push(H(y,x-1));
    if(x<G&&bridges.has(y+','+x))o.push(H(y,x));
    return o.filter(k=>!good.has(k)&&!pre.has(k));};
  for(const pb of probs){const o=out(pb.p,pb.r);
    for(const k of o)red.add(k);
    if(!o.length)red.add(V(pb.p,pb.r)); // 直走後中斷,後面沒有線:標最後一段直線
  }
  // 從所有起點往下(含左右橫線)走得到的線,都能往上找到開頭;其餘亮線是孤立在外的,整段標紅
  const top=new Set(),st=[];
  for(let c=0;c<C;c++)if(W.has(c+',0')){top.add(V(c,0));st.push([c,0]);}
  while(st.length){const [x,y]=st.pop();
    const d=V(x,y+1);if(W.has(x+','+(y+1))&&!top.has(d)){top.add(d);if(y+1<R)st.push([x,y+1]);}
    for(const [g,n] of [[x-1,x-1],[x,x+1]]){const h=H(y,g);
      if(g>=0&&g<G&&bridges.has(y+','+g)&&!top.has(h)){top.add(h);st.push([n,y]);}}
  }
  const stray=[...W].filter(k=>{const [c,j]=k.split(',').map(Number);return !top.has(V(c,j));});
  const sw=new Set(stray);
  for(const k of stray){const [c,j]=k.split(',').map(Number);red.add(V(c,j));}
  // 連接兩段孤立亮線的橫線也算孤立的一部分
  const touchS=(c,r)=>sw.has(c+','+r)||sw.has(c+','+(r+1));
  for(const k of bridges){const [r,g]=k.split(',').map(Number);
    if(!top.has(H(r,g))&&touchS(g,r)&&touchS(g+1,r))red.add(H(r,g));}
  if(stray.length)msgs.push('有走過的線段沒有接到起點:'+[...new Set(stray.map(k=>+k.split(',')[0]))].sort().map(c=>L[c]+' 欄').join('、'));
  const badWalked=new Set(),badKeys=new Set();
  for(const k of red)(k[0]==='v'?badWalked:badKeys).add(k.slice(1));
  return {paths,msgs,badWalked,badKeys};
}
// 清單路徑在第 r 列的點之後直接接著的那條線(轉彎走的橫線或往下的直線)
function pathOut(pa,r){
  const p=walk(pa).cols[r],m=pa.m[r];
  return m==='L'?{brs:[r+','+(p-1)],segs:[]}:m==='R'?{brs:[r+','+p],segs:[]}:{brs:[],segs:[p+','+(r+1)]};
}
// 清單路徑與某個點相接(從上面走進來或從這點往下走)
const touches=(pa,c,r)=>{const s=pathMarks(pa).segs;return s.includes(c+','+r)||s.includes(c+','+(r+1));};
// 一條完整路徑經過的直線段與橫線
function pathMarks(pa){
  let p=pa.s;const segs=[p+',0'],brs=[];
  for(let r=0;r<R;r++){const m=pa.m[r];
    if(m==='L'){brs.push(r+','+(p-1));p--;}else if(m==='R'){brs.push(r+','+p);p++;}
    segs.push(p+','+(r+1));}
  return {segs,brs};
}
// 上面點到底的完整路徑自動移進下方清單(改由清單畫線);與清單同起點同走法的重複標記直接清掉
function absorbWalked(){
  // 清單路徑若接著盤面上的亮線(例如存檔前就加入清單、之後才點的分岔),先拆回來一起重新追蹤,結果才不受操作順序影響
  const W=S.walked.map(k=>k.split(',').map(Number));
  for(let i=S.paths.length-1;i>=0;i--)
    if(W.some(([c,j])=>(j>0&&touches(S.paths[i],c,j-1))||(j<R&&touches(S.paths[i],c,j))))unpackPath(i);
  const chk=checkWalk(new Set([...derive(S.paths).present,...S.manual]));
  for(const t of chk.paths){
    const ex=S.paths.find(p=>p.s===t.s);
    if(ex&&ex.m.join()!==t.m.join())continue; // 走法不同,留給 render 標紅提示
    if(!ex)S.paths.push({s:t.s,m:t.m});
    S.walked=S.walked.filter(k=>!t.segs.includes(k)); // 手動畫的橫線保留,刪掉清單路徑時不會跟著消失
  }
  S.paths.sort((a,b)=>a.s-b.s);
}
// 把清單裡的一條路徑拆回上面的手動標記,方便在盤面上逐段修改
function unpackPath(i){
  const {segs,brs}=pathMarks(S.paths[i]);
  S.paths.splice(i,1);
  for(const k of segs)if(!S.walked.includes(k))S.walked.push(k);
  for(const k of brs)if(!S.manual.includes(k))S.manual.push(k);
}
function render(){
  absorbWalked();
  save();
  $('n').value=S.n;
  renderPaths();
  const base=derive(S.paths);
  const chk=checkWalk(new Set([...base.present,...S.manual]));
  const allPaths=[...S.paths];
  const markAfter=(pa,r)=>{const a=pathOut(pa,r);for(const k of a.segs)chk.badWalked.add(k);for(const k of a.brs)chk.badKeys.add(k);};
  for(const t of chk.paths){
    const ex=S.paths.find(p=>p.s===t.s);
    if(!ex){allPaths.push({s:t.s,m:t.m});continue;}
    if(ex.m.join()!==t.m.join()){
      const r=t.m.findIndex((m,i)=>m!==ex.m[i]);
      chk.msgs.push(L[t.s]+' 出發:盤面上點的路徑與清單記錄的走法在第 '+(r+1)+' 列分岔');
      markAfter(t,r);markAfter(ex,r);
    }
  }
  // 清單路徑(手動編輯或截圖匯入)經過的點若兩側同時有橫線,從該點之後標紅
  const brAll=new Set([...base.present,...S.manual]);
  for(const pa of S.paths){const cols=walk(pa).cols;
    for(let r=0;r<R;r++){const p=cols[r];
      if(p>0&&p<G&&brAll.has(r+','+(p-1))&&brAll.has(r+','+p)){
        chk.msgs.push(L[pa.s]+' 出發的路徑在第 '+(r+1)+' 列的 '+L[p]+' 兩側同時有橫線');
        chk.badKeys.add(r+','+(p-1));chk.badKeys.add(r+','+p);markAfter(pa,r);break;}
    }}
  const d=derive(allPaths);
  for(const k of S.manual)d.present.add(k);
  const hit=[...d.present].filter(k=>d.absent.has(k));
  if(hit.length){d.bad=true;for(const k of hit)chk.badKeys.add(k);
    // 路徑在有橫線的點卻直走:從該點之後標紅
    for(const pa of allPaths){const cols=walk(pa).cols;
      for(let r=0;r<R;r++)if(pa.m[r]==='S'&&hit.some(k=>{const [hr,g]=k.split(',').map(Number);return hr===r&&(g===cols[r]||g+1===cols[r]);})){markAfter(pa,r);break;}}
    chk.msgs.unshift('橫線與已走過的路徑矛盾:'+hit.map(k=>{const [r,g]=k.split(',').map(Number);return '第 '+(r+1)+' 列 '+L[g]+'–'+L[g+1];}).join('、'));}
  chk.msgs=[...new Set(chk.msgs)];
  // 盤面還有問題時不計算配置與機率,等問題都解決才顯示
  const hasErr=chk.msgs.length>0;
  const res=d.bad||hasErr?{tot:0,cnt:[]}:compute(S.n,d.present,d.absent);
  const {tot,cnt}=res;
  const usedStart=allPaths.map(p=>p.s), usedEnd=allPaths.map(p=>walk(p).end);
  const t=S.target;
  let top3=[],sum='';
  if(hasErr){
    sum='<span class="err">'+chk.msgs.join('<br>')+'</span>';
    $('table').innerHTML='';
  }else if(!tot){
    sum='<span class="err">沒有任何合法配置:請檢查橫線總數是否正確,或路徑記錄是否互相矛盾。</span>';
    $('table').innerHTML='';
  }else{
    if(!usedEnd.includes(t)){
      const order=[...Array(C).keys()].filter(s=>!usedStart.includes(s)).sort((a,b)=>cnt[b][t]-cnt[a][t]);
      top3=order.slice(0,3).filter(s=>cnt[s][t]>0);
    }
    sum='<span class="note">目前符合條件的配置:'+tot.toLocaleString()+' 種</span>';
    let tb='<table><tr><th>起點＼獎賞</th>'+[...Array(C).keys()].map(c=>'<th>'+(c+1)+'</th>').join('')+'</tr>';
    const best=[...Array(C).keys()].map(e=>{let b=-1;for(let s=0;s<C;s++){if(usedStart.includes(s))continue;if(b<0||cnt[s][e]>cnt[b][e])b=s;}return b;});
    for(let s=0;s<C;s++){
      tb+='<tr'+(usedStart.includes(s)?' class="used"':'')+'><th>'+L[s]+'</th>';
      for(let e=0;e<C;e++){
        const p=cnt[s][e]/tot*100;
        tb+='<td class="'+(best[e]===s&&p>0?'best':p===0?'z':'')+'">'+fmt(p)+'</td>';
      }
      tb+='</tr>';
    }
    $('table').innerHTML=tb+'</table>';
  }
  $('sum').innerHTML=sum;
  $('known').textContent=d.present.size;
  board({tot,cnt,t,usedStart,usedEnd,top3,badKeys:chk.badKeys,badWalked:chk.badWalked});
}

document.addEventListener('click',e=>{
  const sl=e.target.closest('.slot');
  if(sl){S.target=+sl.dataset.t;render();return;}
  const sv=e.target.closest('.seg.v');
  if(sv){
    const k=sv.dataset.c+','+sv.dataset.j,pi=S.paths.findIndex(p=>pathMarks(p).segs.includes(k));
    if(!S.walked.includes(k)&&pi>=0)unpackPath(pi); // 點到清單路徑上的線段:拆回手動標記後取消這段
    else if(!S.walked.includes(k)){
      // 新點亮的線段接在清單路徑的點上:拆回重新追蹤,才能判斷是否分岔,也不受點擊順序影響
      const c=+sv.dataset.c,j=+sv.dataset.j;
      for(let x=S.paths.length-1;x>=0;x--)if((j>0&&touches(S.paths[x],c,j-1))||(j<R&&touches(S.paths[x],c,j)))unpackPath(x);
    }
    const i=S.walked.indexOf(k);
    if(i>=0)S.walked.splice(i,1);else S.walked.push(k);
    render();return;
  }
  const sg=e.target.closest('.seg');
  if(sg){
    const k=sg.dataset.r+','+sg.dataset.g;
    if(derive(S.paths).present.has(k)){
      // 點到清單路徑上的橫線:把經過它的路徑拆回手動標記,再移除這條橫線
      for(let i=S.paths.length-1;i>=0;i--)if(pathMarks(S.paths[i]).brs.includes(k))unpackPath(i);
      if(!S.manual.includes(k))S.manual.push(k);
    }
    const i=S.manual.indexOf(k);
    if(i>=0)S.manual.splice(i,1);
    else{
      // 新增橫線時,經過這條橫線兩端任一點的清單路徑都拆回手動標記重新追蹤,
      // 結果才會和「先畫橫線再點路徑」一樣,不受點擊順序影響
      const [r,g]=k.split(',').map(Number);
      for(let j=S.paths.length-1;j>=0;j--)if(touches(S.paths[j],g,r)||touches(S.paths[j],g+1,r))unpackPath(j);
      S.manual.push(k);
    }
    render();return;
  }
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.r!==undefined){
    const pa=S.paths[+b.dataset.i],r=+b.dataset.r;
    pa.m[r]=nextMove(walk(pa).cols[r],pa.m[r]);sanitize(pa);
  }
  else if(b.dataset.del!==undefined){S.paths.splice(+b.dataset.del,1);}
  else if(b.id==='add'){const s=[...Array(C).keys()].find(s=>!S.paths.some(p=>p.s===s));if(s===undefined)return;S.paths.push({s,m:['S','S','S','S','S']});}
  else if(b.id==='reset'){S.paths=[];S.manual=[];S.walked=[];}
  else return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('st')){const pa=S.paths[+t.dataset.i];pa.s=+t.value;sanitize(pa);}
  else if(t.id==='n'){S.n=Math.max(1,Math.min(25,+t.value||1));}
  else return;
  render();
});
render();

// ---- 截圖上傳 ----
let ocrWorker=null;
async function getOcr(){
  if(ocrWorker) return ocrWorker;
  if(!window.Tesseract){
    await new Promise((ok,ng)=>{const t=document.createElement('script');
      t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';t.onload=ok;t.onerror=ng;document.head.appendChild(t);});
  }
  ocrWorker=await Tesseract.createWorker('eng');
  await ocrWorker.setParameters({tessedit_char_whitelist:'0123456789/xX× ',tessedit_pageseg_mode:'7'});
  return ocrWorker;
}
function cropPx(c,x,y,w,h,scale,invert){
  const o=document.createElement('canvas');
  o.width=Math.max(1,Math.round(w*scale));o.height=Math.max(1,Math.round(h*scale));
  const g=o.getContext('2d');g.drawImage(c,x,y,w,h,0,0,o.width,o.height);
  if(invert){g.globalCompositeOperation='difference';g.fillStyle='#fff';g.fillRect(0,0,o.width,o.height);}
  return o;
}
// 在盤面上方找「橫線數量」的黑色長條(位置與大小都由圖片本身決定),只辨識其中的「a / N」
function findBar(c,limitY){
  const W=c.width,data=c.getContext('2d').getImageData(0,0,W,Math.max(1,Math.floor(limitY))).data;
  const x0=Math.round(W*.3),x1=Math.round(W*.7),min=W*0.012;let run=null,best=null;
  const close=()=>{if(run&&run.y1-run.y0>=min)best=run;run=null;};
  for(let y=0;y<Math.floor(limitY);y++){
    let d=0,t=0;
    for(let x=x0;x<x1;x+=3){t++;const i=(y*W+x)*4;if(data[i]<60&&data[i+1]<60&&data[i+2]<60)d++;}
    if(d/t>0.6){if(!run)run={y0:y,y1:y};else run.y1=y;}else close();
  }
  close();
  return best; // 取最靠近盤面的深色長條
}
async function readTotal(c,geo){
  try{
    if(!geo)return null;
    const bar=findBar(c,geo.topY-geo.dx*0.6);
    if(!bar)return null;
    const w=await getOcr(),W=c.width,h=bar.y1-bar.y0+1;
    const t=(await w.recognize(cropPx(c,W*.47,bar.y0,W*.23,h,Math.max(1,60/h),true))).data.text;
    const m=t.match(/\/\s*(\d{1,2})/);
    return m?+m[1]:null;
  }catch(e){return null;}
}
// 由盤面幾何(以格距換算)裁出下方 6 個獎賞圖示;被截掉或裁不到時回傳 null
function cropIcons(c,geo){
  if(!geo)return null;
  const d=geo.dx,top=geo.botY+0.24*d,size=0.92*d,out=[];
  const avail=Math.min(size,c.height-top);
  if(avail<size*0.85)return null; // 底部被截掉太多才放棄,稍微截到仍保留可見部分
  for(let i=0;i<6;i++){
    const x=geo.xs[i]-size/2;
    if(x<0||x+size>c.width+1)return null;
    const o=document.createElement('canvas');o.width=o.height=104;
    o.getContext('2d').drawImage(c,x,top,size,avail,0,0,104,104*avail/size);
    out.push(o.toDataURL('image/webp',0.88));
  }
  return out;
}
function loadImg(file){
  return new Promise((ok,ng)=>{const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>ok(i);i.onerror=ng;i.src=u;});
}
async function handleFiles(files){
  const st=$('status');const msgs=[],fails=[];let cleared=false;
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    st.textContent='讀取中…(第一次會下載文字辨識模組,約數秒)';
    try{
      const img=await loadImg(f);
      const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
      const g=c.getContext('2d');g.drawImage(img,0,0);
      const rs=analyze(g.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(!rs.geo){fails.push('「'+f.name+'」找不到盤面,路徑沒有辨識成功。請上傳含完整格點的截圖。');continue;}
      if(!cleared){S.paths=[];S.manual=[];S.walked=[];cleared=true;}
      const ic=cropIcons(c,rs.geo);if(ic)S.icons=ic;
      const parts=[];
      for(const r of rs){
        const i=S.paths.findIndex(p=>p.s===r.s);
        if(i>=0)S.paths[i]=r;else S.paths.push(r);
        parts.push(L[r.s]+'→'+L[walk(r).end]);
      }
      let line=rs.length?rs.length+' 條路徑('+parts.join('、')+')':'尚無走過的路徑';
      render(); // 先畫出新盤面,避免等文字辨識時使用者點到還是舊盤面的線
      const n=await readTotal(c,rs.geo);
      if(n&&n>=1&&n<=25){S.n=n;line+=',橫線總數 '+n;}
      else line+=',沒辨識到橫線總數,請在下方手動確認';
      if(!ic)line+=',獎賞圖示未能擷取';
      msgs.push(line);
      render();
    }catch(e){fails.push('「'+f.name+'」讀取失敗。');}
  }
  st.textContent=msgs.length?'已讀取:'+msgs.join(';'):'';
  if(fails.length)alert(fails.join('\n'));
}
$('file').addEventListener('change',e=>{handleFiles([...e.target.files]);e.target.value='';});
const dz=$('drop');
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over');}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over');}));
dz.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length)handleFiles(fs);});
