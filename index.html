<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交錯命途機率計算</title>
<style>
:root{--bg:#101216;--fg:#ece9e1;--mut:#9a978d;--card:#1b1e24;--line:#333843;--acc:#e0b95c;--accfg:#1a1405;--bad:#d9685a;--gold:#f7c859;--silver:#d5dbe5;--bronze:#d28b4c}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:4px 0 10px;text-align:center}
h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
button{font:inherit;color:var(--fg);cursor:pointer}
#drop.over{outline:2px dashed var(--acc);outline-offset:4px;border-radius:14px}
.board{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% 0,#2a3a38 0,#14171a 45%,#0e1013 100%);border-radius:14px;border:1px solid var(--line)}
.board .slot{cursor:pointer}
.board .slot:hover rect.bg{stroke:var(--gold)}
.sum{text-align:center;margin:10px 0 0;font-size:15px}
.sum b{color:var(--gold)}
.paths{display:flex;flex-direction:column;gap:10px}
.path{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.path select{font:inherit;padding:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.mv{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.mv.t{background:#3a7ca5;color:#fff;border-color:#3a7ca5}

.x{border:none;background:none;color:var(--bad);font-size:20px;padding:4px 8px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.add{padding:8px 14px;border-radius:8px;border:1px dashed var(--line);background:none;display:inline-block;cursor:pointer}
.set{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.set label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.set input{font:inherit;padding:6px 8px;width:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}

th{color:var(--mut);font-weight:500}
td.best{background:var(--acc);color:var(--accfg);font-weight:700}
td.z{color:var(--mut);opacity:.5}
tr.used td,tr.used th{opacity:.45}
.err{color:var(--bad)}
#status:empty{display:none}
</style>
</head>
<body>
<main id="drop">
<h1>交錯命途 · 起點機率計算</h1>

<svg class="board" id="board" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg"></svg>
<p class="sum" id="sum"></p>
<p class="note" style="text-align:center;margin-bottom:14px">點下方的獎賞,上方起點會標出機率與前三名。</p>

<div class="card">
  <h2>已走過的路徑(每走一次就記一筆)</h2>
  <p class="note" id="status" style="margin:0 0 8px"></p>
  <div class="paths" id="paths"></div>
  <div class="btns">
    <button class="add" id="add">＋ 新增路徑</button>
    <label class="add">📷 上傳截圖<input type="file" id="file" accept="image/*" multiple hidden></label>
    <button class="add" id="reset">換新樓層</button>
  </div>
  <p class="note">可上傳、拖曳圖片進來,或 Ctrl+V 貼上遊戲截圖自動讀取。手動記錄時每層點按切換:↓ 直走、← 左移、→ 右移。直走代表該處兩側都沒有橫線,工具會據此縮小可能的配置。</p>
</div>

<div class="card">
  <h2>本層設定</h2>
  <div class="set">
    <label>橫線總數(畫面上方「橫線數量 a / N」)<input id="n" type="number" min="1" max="25" value="7"></label>
  </div>
  <p class="note">版面固定 6 直線 × 5 層,同一層的橫線不會共用端點(上下層可以相連);每條直線至少連 1 條橫線;假設合法配置機率相同。</p>
</div>

<div class="card">
  <details><summary>完整機率表(起點 → 獎賞)</summary><div id="table"></div></details>
</div>
</main>
<script>
/*CORE*/
const R=5,C=6,G=5;
function derive(paths){
  const present=new Set(),absent=new Set();
  for(const pa of paths){
    let p=pa.s;
    for(let r=0;r<R;r++){
      const m=pa.m[r];
      if(m==='S'){ if(p>0)absent.add(r+','+(p-1)); if(p<G)absent.add(r+','+p); }
      else if(m==='L'){ present.add(r+','+(p-1)); p--; }
      else { present.add(r+','+p); p++; }
    }
  }
  let bad=false;
  for(const k of present) if(absent.has(k)) bad=true;
  return {present,absent,bad};
}
function compute(n,present,absent){
  const cnt=Array.from({length:C},()=>Array(C).fill(0));
  let tot=0;
  const grid=Array.from({length:R},()=>Array(G).fill(false));
  const cover=Array(C).fill(0);
  const get=(r,g)=>r>=0&&r<R&&g>=0&&g<G&&grid[r][g];
  function can(r,g){
    if(get(r,g-1)||get(r,g+1))return false;
    return true;
  }
  const put=(r,g,v)=>{grid[r][g]=v;const d=v?1:-1;cover[g]+=d;cover[g+1]+=d;};
  const forced=[...present].map(k=>k.split(',').map(Number));
  for(const [r,g] of forced){ if(!can(r,g)) return {tot:0,cnt}; put(r,g,true); }
  const slots=[];
  for(let r=0;r<R;r++)for(let g=0;g<G;g++) if(!grid[r][g]&&!absent.has(r+','+g)) slots.push([r,g]);
  const need=n-forced.length;
  if(need<0) return {tot:0,cnt};
  function leaf(){
    for(let i=0;i<C;i++) if(!cover[i]) return;
    tot++;
    for(let st=0;st<C;st++){
      let p=st;
      for(let r=0;r<R;r++){
        if(p<G&&grid[r][p]) p++;
        else if(p>0&&grid[r][p-1]) p--;
      }
      cnt[st][p]++;
    }
  }
  function dfs(i,left){
    if(left===0){leaf();return;}
    if(slots.length-i<left) return;
    const [r,g]=slots[i];
    if(can(r,g)){ put(r,g,true); dfs(i+1,left-1); put(r,g,false); }
    dfs(i+1,left);
  }
  dfs(0,need);
  return {tot,cnt};
}
/*END*/
/*VISION*/
// 以截圖比例定位格點(座標取自 921×2000 的手機截圖),偵測所有青白色發光路徑(可同時有多條)
function analyze(data,W,H){
  const sx=W/921, sy=H/2000;
  const xs=[123,258,393,528,663,799].map(v=>v*sx);
  const ys=[737,889,1041,1193,1345].map(v=>v*sy);
  const topY=583*sy;
  const lit=(x,y)=>{x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return false;
    const i=(y*W+x)*4;return data[i]>=140&&data[i+1]>=235&&data[i+2]>=235;};
  const vfrac=(x,y0,y1)=>{let a=0,t=0;for(let y=y0;y<=y1;y+=2){for(let d=-3;d<=3;d+=3){t++;if(lit(x+d*sx,y))a++;}}return t?a/t:0;};
  const hfrac=(x0,x1,y)=>{let a=0,t=0;for(let x=x0;x<=x1;x+=2){for(let d=-3;d<=3;d+=3){t++;if(lit(x,y+d*sy))a++;}}return t?a/t:0;};
  const out=[];
  for(let c=0;c<6;c++){
    if(vfrac(xs[c],topY+18*sy,ys[0]-18*sy)<0.5) continue;
    const m=[];let p=c;
    for(let r=0;r<5;r++){
      const y=ys[r];
      if(p<5&&hfrac(xs[p]+22*sx,xs[p+1]-22*sx,y)>=0.5){m.push('R');p++;}
      else if(p>0&&hfrac(xs[p-1]+22*sx,xs[p]-22*sx,y)>=0.5){m.push('L');p--;}
      else m.push('S');
    }
    out.push({s:c,m});
  }
  return out;
}
/*ENDV*/

const L="ABCDEF";
let S={n:7,target:2,paths:[{s:3,m:['R','S','S','S','R']}]};
try{const v=JSON.parse(localStorage.getItem('amida'));if(v&&v.paths)S=v;}catch(e){}
const save=()=>{try{localStorage.setItem('amida',JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);

function walk(pa){ // returns column before each row and the end column
  let p=pa.s;const cols=[];
  for(let r=0;r<R;r++){cols.push(p);const m=pa.m[r];if(m==='L')p--;else if(m==='R')p++;}
  return {cols,end:p};
}
function sanitize(pa){
  let p=pa.s;
  for(let r=0;r<R;r++){
    let m=pa.m[r];
    if(m==='L'&&p===0)m='S';
    if(m==='R'&&p===G)m='S';
    pa.m[r]=m;
    if(m==='L')p--;else if(m==='R')p++;
  }
}
function nextMove(p,m){
  const order=['S','L','R'];
  for(let i=1;i<=3;i++){
    const c=order[(order.indexOf(m)+i)%3];
    if(c==='L'&&p===0)continue;
    if(c==='R'&&p===G)continue;
    return c;
  }
  return 'S';
}
const ARROW={S:'↓',L:'←',R:'→'};

function renderPaths(){
  $('paths').innerHTML=S.paths.map((pa,i)=>{
    const w=walk(pa);
    return '<div class="path"><select data-i="'+i+'" class="st">'+
      [...L].map((c,k)=>'<option value="'+k+'"'+(k===pa.s?' selected':'')+'>'+c+' 出發</option>').join('')+'</select>'+
      pa.m.map((m,r)=>'<button class="mv'+(m!=='S'?' t':'')+'" data-i="'+i+'" data-r="'+r+'">'+ARROW[m]+'</button>').join('')+
      '<span class="res">→ '+L[w.end]+'</span><button class="x" data-del="'+i+'">×</button></div>';
  }).join('')||'<p class="note" style="margin:0">尚未記錄路徑。</p>';
}

const X=i=>50+i*100,YR=r=>260+r*100,Y0=172,Y1=730;
const MEDAL=['var(--gold)','var(--silver)','var(--bronze)'];
function board(ctx){
  const {tot,cnt,t,usedStart,usedEnd,top3}=ctx;
  let g='';
  for(let c=0;c<C;c++) g+='<line x1="'+X(c)+'" y1="'+Y0+'" x2="'+X(c)+'" y2="'+Y1+'" stroke="#8a7a5c" stroke-width="7" stroke-linecap="round"/>';
  for(const pa of S.paths){
    let p=pa.s,pts=[X(p)+','+Y0];
    for(let r=0;r<R;r++){pts.push(X(p)+','+YR(r));const m=pa.m[r];if(m==='L')p--;else if(m==='R')p++;pts.push(X(p)+','+YR(r));}
    pts.push(X(p)+','+Y1);
    g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#bff6ff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #4fd8ee)"/>';
  }
  for(let c=0;c<C;c++)for(let r=0;r<R;r++) g+='<circle cx="'+X(c)+'" cy="'+YR(r)+'" r="9" fill="#5aa9e6"/>';
  for(let c=0;c<C;c++){
    g+='<circle cx="'+X(c)+'" cy="'+Y0+'" r="13" fill="#b99a63" stroke="#f2ecdc" stroke-width="3"/><circle cx="'+X(c)+'" cy="'+Y1+'" r="13" fill="#b99a63" stroke="#f2ecdc" stroke-width="3"/>';
  }
  for(let c=0;c<C;c++){
    const rank=top3.indexOf(c),used=usedStart.includes(c);
    const ring=rank>=0?MEDAL[rank]:'#b99a63';
    g+='<g opacity="'+(used?0.4:1)+'"><circle cx="'+X(c)+'" cy="50" r="38" fill="#2f7f8f" stroke="'+ring+'" stroke-width="'+(rank>=0?8:5)+'"'+(rank>=0?' style="filter:drop-shadow(0 0 8px '+ring+')"':'')+'/>'+
      '<text x="'+X(c)+'" y="64" text-anchor="middle" font-size="40" font-weight="700" font-family="Georgia,serif" fill="#f4ecd6">'+L[c]+'</text>';
    if(tot&&!usedEnd.includes(t)&&!used){
      const p=cnt[c][t]/tot*100;
      g+='<text x="'+X(c)+'" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="'+(rank>=0?MEDAL[rank]:'#ece9e1')+'">'+p.toFixed(1)+'%</text>';
      if(rank>=0) g+='<rect x="'+(X(c)-28)+'" y="126" width="56" height="22" rx="11" fill="'+MEDAL[rank]+'"/><text x="'+X(c)+'" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1405">第 '+(rank+1)+' 名</text>';
    }else if(used) g+='<text x="'+X(c)+'" y="118" text-anchor="middle" font-size="18" fill="#9a978d">已走過</text>';
    g+='</g>';
  }
  for(let c=0;c<C;c++){
    const sel=t===c,got=usedEnd.includes(c),x=X(c)-44;
    g+='<g class="slot" data-t="'+c+'"><rect class="bg" x="'+x+'" y="758" width="88" height="106" rx="8" fill="#1a1c22" stroke="'+(sel?'#f7c859':'#b99a63')+'" stroke-width="'+(sel?6:3)+'"'+(sel?' style="filter:drop-shadow(0 0 8px #f7c859)"':'')+'/>'+
      '<text x="'+X(c)+'" y="822" text-anchor="middle" font-size="46" font-weight="700" font-style="italic" font-family="Georgia,serif" fill="'+(got?'#6b685f':'#f4ecd6')+'">'+(c+1)+'</text>'+
      (got?'<text x="'+X(c)+'" y="850" text-anchor="middle" font-size="16" fill="#9a978d">已取得</text>':'<text x="'+X(c)+'" y="850" text-anchor="middle" font-size="14" fill="#9a978d">獎賞</text>')+'</g>';
  }
  $('board').innerHTML=g;
}
function render(){
  save();
  $('n').value=S.n;
  renderPaths();
  const d=derive(S.paths);
  const res=d.bad?{tot:0,cnt:[]}:compute(S.n,d.present,d.absent);
  const {tot,cnt}=res;
  const usedStart=S.paths.map(p=>p.s), usedEnd=S.paths.map(p=>walk(p).end);
  const t=S.target;
  let top3=[],sum='';
  if(!tot){
    sum='<span class="err">沒有任何合法配置:請檢查橫線總數是否正確,或路徑記錄是否互相矛盾。</span>';
    $('table').innerHTML='';
  }else{
    if(usedEnd.includes(t)) sum='第 '+(t+1)+' 號獎賞已經取得(從 <b>'+L[usedStart[usedEnd.indexOf(t)]]+'</b> 出發)。';
    else{
      const order=[...Array(C).keys()].filter(s=>!usedStart.includes(s)).sort((a,b)=>cnt[b][t]-cnt[a][t]);
      top3=order.slice(0,3).filter(s=>cnt[s][t]>0);
      sum='想要 <b>'+(t+1)+'</b> 號獎賞 → 最好從 <b>'+L[order[0]]+'</b> 出發,機率 <b>'+(cnt[order[0]][t]/tot*100).toFixed(1)+'%</b>';
    }
    sum+='<br><span class="note">目前符合條件的配置:'+tot.toLocaleString()+' 種</span>';
    let tb='<table><tr><th>起點＼獎賞</th>'+[...Array(C).keys()].map(c=>'<th>'+(c+1)+'</th>').join('')+'</tr>';
    const best=[...Array(C).keys()].map(e=>{let b=-1;for(let s=0;s<C;s++){if(usedStart.includes(s))continue;if(b<0||cnt[s][e]>cnt[b][e])b=s;}return b;});
    for(let s=0;s<C;s++){
      tb+='<tr'+(usedStart.includes(s)?' class="used"':'')+'><th>'+L[s]+'</th>';
      for(let e=0;e<C;e++){
        const p=cnt[s][e]/tot*100;
        tb+='<td class="'+(best[e]===s&&p>0?'best':p===0?'z':'')+'">'+p.toFixed(1)+'%</td>';
      }
      tb+='</tr>';
    }
    $('table').innerHTML=tb+'</table><p class="note">每欄標色處是該獎賞尚未使用的最佳起點;灰色列是已走過的起點。</p>';
  }
  $('sum').innerHTML=sum;
  board({tot,cnt,t,usedStart,usedEnd,top3});
}

document.addEventListener('click',e=>{
  const sl=e.target.closest('.slot');
  if(sl){S.target=+sl.dataset.t;render();return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.r!==undefined){
    const pa=S.paths[+b.dataset.i],r=+b.dataset.r;
    pa.m[r]=nextMove(walk(pa).cols[r],pa.m[r]);sanitize(pa);
  }
  else if(b.dataset.del!==undefined){S.paths.splice(+b.dataset.del,1);}
  else if(b.id==='add'){S.paths.push({s:[...Array(C).keys()].find(s=>!S.paths.some(p=>p.s===s))??0,m:['S','S','S','S','S']});}
  else if(b.id==='reset'){S.paths=[];}
  else return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('st')){const pa=S.paths[+t.dataset.i];pa.s=+t.value;sanitize(pa);}
  else if(t.id==='n'){S.n=Math.max(1,Math.min(25,+t.value||1));}
  else return;
  render();
});
render();

// ---- 截圖上傳 ----
let ocrWorker=null;
async function getOcr(){
  if(ocrWorker) return ocrWorker;
  if(!window.Tesseract){
    await new Promise((ok,ng)=>{const t=document.createElement('script');
      t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';t.onload=ok;t.onerror=ng;document.head.appendChild(t);});
  }
  ocrWorker=await Tesseract.createWorker('eng');
  await ocrWorker.setParameters({tessedit_char_whitelist:'0123456789/xX× ',tessedit_pageseg_mode:'7'});
  return ocrWorker;
}
function crop(img,x0,y0,x1,y1,scale,invert){
  const W=img.width,H=img.height,c=document.createElement('canvas');
  const w=(x1-x0)/921*W,h=(y1-y0)/2000*H;
  c.width=w*scale;c.height=h*scale;
  const g=c.getContext('2d');g.drawImage(img,x0/921*W,y0/2000*H,w,h,0,0,c.width,c.height);
  if(invert){g.globalCompositeOperation='difference';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);}
  return c;
}
async function readTotal(img){
  try{
    const w=await getOcr();
    // 上方長條「橫線數量:a / b」取 b;失敗再用左上角「橫線 xN」
    const t1=(await w.recognize(crop(img,380,312,545,354,3,true))).data.text;
    let m=t1.match(/\/\s*(\d{1,2})/);
    if(m) return +m[1];
    const t2=(await w.recognize(crop(img,235,180,370,222,4,false))).data.text;
    m=t2.match(/(\d{1,2})\s*$/m);
    return m?+m[1]:null;
  }catch(e){return null;}
}
function loadImg(file){
  return new Promise((ok,ng)=>{const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>ok(i);i.onerror=ng;i.src=u;});
}
async function handleFiles(files){
  const st=$('status');const msgs=[];let cleared=false;
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    st.textContent='讀取中…(第一次會下載文字辨識模組,約數秒)';
    try{
      const img=await loadImg(f);
      const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
      const g=c.getContext('2d');g.drawImage(img,0,0);
      const rs=analyze(g.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(!cleared){S.paths=[];cleared=true;}
      const parts=[];
      for(const r of rs){
        const i=S.paths.findIndex(p=>p.s===r.s);
        if(i>=0)S.paths[i]=r;else S.paths.push(r);
        parts.push(L[r.s]+'→'+L[walk(r).end]);
      }
      let line=rs.length?rs.length+' 條路徑('+parts.join('、')+')':'尚無走過的路徑';
      const n=await readTotal(img);
      if(n&&n>=1&&n<=25){S.n=n;line+=',橫線總數 '+n;}
      else line+=',沒辨識到橫線總數,請在下方手動確認';
      msgs.push(line);
      render();
    }catch(e){msgs.push('「'+f.name+'」讀取失敗。');}
  }
  st.textContent=msgs.length?'已讀取:'+msgs.join(';'):'';
}
$('file').addEventListener('change',e=>{handleFiles([...e.target.files]);e.target.value='';});
const dz=$('drop');
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over');}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over');}));
dz.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length)handleFiles(fs);});
